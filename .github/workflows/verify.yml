name: Build and verify Digital Analog
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: digitalanalog-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Portable Swift core tests
        run: ./scripts/test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-test-results
          path: Verification/
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode with iOS 26 SDK
        shell: bash
        run: |
          set -euo pipefail
          candidate=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort | tail -1)
          if [[ -n "$candidate" ]]; then sudo xcode-select -s "$candidate/Contents/Developer"; fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Generate project
        run: python3 scripts/generate_project.py
      - name: Build device application without credentials
        run: |
          set -o pipefail
          mkdir -p Verification
          xcodebuild -project DigitalAnalog.xcodeproj -scheme DigitalAnalog -configuration Release -destination 'generic/platform=iOS' -derivedDataPath .derived-device CODE_SIGNING_ALLOWED=NO build 2>&1 | tee Verification/device-build.log
      - name: Run hosted iOS tests
        shell: bash
        run: |
          set -euo pipefail
          simulator=$(xcrun simctl list devices available -j | python3 -c 'import sys,json;d=json.load(sys.stdin);groups=sorted(d["devices"].items(),key=lambda x:("iOS-26" in x[0],x[0]),reverse=True);print(next(x["udid"] for _,g in groups for x in g if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$simulator" || true
          xcrun simctl bootstatus "$simulator" -b
          # Xcode may boot a test clone even without parallel execution.
          # Record every booted destination, not just the requested base device.
          (
            while true; do
              for device in $(xcrun simctl list devices booted -j | python3 -c 'import sys,json;print(" ".join(x["udid"] for g in json.load(sys.stdin)["devices"].values() for x in g if x["state"]=="Booted"))'); do
                if [[ ! -f "Verification/record-$device.pid" ]]; then
                  xcrun simctl io "$device" recordVideo --codec=h264 --force "Verification/motion-$device.mp4" &
                  echo $! > "Verification/record-$device.pid"
                fi
              done
              sleep 2
            done
          ) &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true; for pidfile in Verification/record-*.pid; do kill -INT "$(cat "$pidfile")" 2>/dev/null || true; done; sleep 2' EXIT
          xcodebuild -project DigitalAnalog.xcodeproj -scheme DigitalAnalog -destination "platform=iOS Simulator,id=$simulator,arch=arm64" -derivedDataPath .derived-simulator -resultBundlePath Verification/iOS.xcresult -parallel-testing-enabled NO -skip-testing:DigitalAnalogTests/CollectionTests/testIndependentArtworkProviderAndOfflineImport -skip-testing:DigitalAnalogUITests CODE_SIGNING_ALLOWED=NO test 2>&1 | tee Verification/ios-tests.log
      - name: Export native render attachments
        run: xcrun xcresulttool export attachments --path Verification/iOS.xcresult --output-path Verification/screenshots
      - name: Independent live artwork import gate
        if: ${{ !cancelled() }}
        # Depends on the live MusicBrainz / Cover Art Archive services, so a miss is reported but does not fail the build.
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          simulator=$(xcrun simctl list devices available -j | python3 -c 'import sys,json;d=json.load(sys.stdin);groups=sorted(d["devices"].items(),key=lambda x:("iOS-26" in x[0],x[0]),reverse=True);print(next(x["udid"] for _,g in groups for x in g if x["name"].startswith("iPhone")))')
          xcodebuild -project DigitalAnalog.xcodeproj -scheme DigitalAnalog -destination "platform=iOS Simulator,id=$simulator,arch=arm64" -derivedDataPath .derived-simulator -resultBundlePath Verification/ArtworkProvider.xcresult -parallel-testing-enabled NO -only-testing:DigitalAnalogTests/CollectionTests/testIndependentArtworkProviderAndOfflineImport CODE_SIGNING_ALLOWED=NO test 2>&1 | tee Verification/artwork-provider.log
      - name: Real gesture and connected library UI journey
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          simulator=$(xcrun simctl list devices available -j | python3 -c 'import sys,json;d=json.load(sys.stdin);groups=sorted(d["devices"].items(),key=lambda x:("iOS-26" in x[0],x[0]),reverse=True);print(next(x["udid"] for _,g in groups for x in g if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$simulator" || true
          xcrun simctl bootstatus "$simulator" -b
          xcrun simctl io "$simulator" recordVideo --codec=h264 --force Verification/Journey.mp4 &
          journey_recording=$!
          trap 'kill -INT "$journey_recording" 2>/dev/null || true; wait "$journey_recording" || true' EXIT
          xcodebuild -project DigitalAnalog.xcodeproj -scheme DigitalAnalog -destination "platform=iOS Simulator,id=$simulator,arch=arm64" -derivedDataPath .derived-simulator -resultBundlePath Verification/Journey.xcresult -parallel-testing-enabled NO -only-testing:DigitalAnalogUITests CODE_SIGNING_ALLOWED=NO test 2>&1 | tee Verification/journey.log
      - name: Export journey evidence including failures
        if: always()
        run: |
          if [ -d Verification/Journey.xcresult ]; then xcrun xcresulttool export attachments --path Verification/Journey.xcresult --output-path Verification/journey; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interaction-evidence
          path: |
            Verification/Journey.mp4
            Verification/journey/
            Verification/journey.log
      - name: Export artwork provider evidence
        if: always()
        run: |
          if [ -d Verification/ArtworkProvider.xcresult ]; then xcrun xcresulttool export attachments --path Verification/ArtworkProvider.xcresult --output-path Verification/provider-art; fi
      - name: Capture the native collection on simulator
        shell: bash
        run: |
          set -euo pipefail
          simulator=$(xcrun simctl list devices available -j | python3 -c 'import sys,json;d=json.load(sys.stdin);groups=sorted(d["devices"].items(),key=lambda x:("iOS-26" in x[0],x[0]),reverse=True);print(next(x["udid"] for _,g in groups for x in g if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$simulator" || true
          xcrun simctl bootstatus "$simulator" -b
          xcrun simctl install "$simulator" .derived-simulator/Build/Products/Debug-iphonesimulator/DigitalAnalog.app
          xcrun simctl launch "$simulator" personal.digitalanalog.player
          sleep 3
          xcrun simctl io "$simulator" screenshot Verification/collection.png
      - name: Package unsigned device IPA for local re-signing
        run: |
          mkdir -p .ipa/Payload
          cp -R .derived-device/Build/Products/Release-iphoneos/DigitalAnalog.app .ipa/Payload/
          cd .ipa
          zip -qr ../DigitalAnalog-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-and-verification
          path: |
            Verification/
            DigitalAnalog-unsigned.ipa
